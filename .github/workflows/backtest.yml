name: Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Years of history'
        default: '10'

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt pytest
    - name: Unit tests
      run: python -m pytest -q tests
    - name: Baseline (scanner rules, next-open entry)
      run: python backtest.py --years ${{ inputs.years }} --cache history_cache.pkl --name baseline
    - name: With entry trigger (buy-stop above signal-day high)
      run: python backtest.py --years ${{ inputs.years }} --cache history_cache.pkl --name trigger --trigger prior_high
    - name: Pre-registered exit/entry grid and score diagnosis
      run: python research.py --years ${{ inputs.years }} --cache history_cache.pkl
    - name: Same-universe benchmarks and pre-registered redesign tests
      run: python benchmarks.py --years ${{ inputs.years }} --cache history_cache.pkl
    - name: Pre-registered experiments (C0 versus H1-H8, hold-out opened once)
      run: python experiments.py --years 12 --cache history_cache_12y.pkl
    - name: Point-in-time universe acceptance test
      run: python pit_report.py --years ${{ inputs.years }} --cache history_cache.pkl
    - name: Stamp reports with provenance
      run: python stamp_reports.py
    - name: Regenerate readiness from the new evidence
      run: |
        python health.py || true
        python readiness.py
    - name: Publish summary
      run: cat reports/experiments.md reports/benchmarks.md reports/universe.md reports/regime.md reports/grid.md reports/diagnosis.md reports/backtest_baseline.md reports/backtest_trigger.md >> "$GITHUB_STEP_SUMMARY"
    - name: Commit reports
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add reports/ health.json readiness.json
        git commit -m "Backtest reports $(date -u +'%Y-%m-%d %H:%M UTC')" || { echo "No changes"; exit 0; }
        git pull --rebase origin main
        git push origin main
