name: Daily Stock Screen

on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run screener
      env:
        # Set repo variables (Settings > Secrets and variables > Actions > Variables) to override.
        EDGE_CAPITAL: ${{ vars.EDGE_CAPITAL || '565000' }}
        EDGE_RISK_PCT: ${{ vars.EDGE_RISK_PCT || '0.5' }}
      run: python screener.py

    - name: Update paper-trade ledger
      env:
        EDGE_CAPITAL: ${{ vars.EDGE_CAPITAL || '565000' }}
        EDGE_RISK_PCT: ${{ vars.EDGE_RISK_PCT || '0.5' }}
      run: python paper.py

    - name: Commit results
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add results.json ledger.json
        git commit -m "Scan update $(date -u +'%Y-%m-%d %H:%M UTC')" || { echo "No changes"; exit 0; }
        git pull --rebase origin main
        git push origin main
